# Temporary probe: surfaces Linux/macOS compile errors while the port lands.
# Folded into build.yml once both platforms are green.
name: Portability probe

on:
  push:
    branches: [main, cross-platform]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config zlib1g-dev \
            liballegro5-dev liballegro-image5-dev liballegro-ttf5-dev \
            liballegro-dialog5-dev liballegro-acodec5-dev
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build --preset linux 2>&1 | tail -200

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install allegro ninja pkg-config
      - name: Configure
        run: cmake --preset macos
      - name: Build
        run: cmake --build --preset macos 2>&1 | tail -200
