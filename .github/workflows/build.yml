name: Build & Test

on:
  push:
    branches: [main, fix-interactive-rendering]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Dependencies come from vcpkg.json (manifest mode); the CMake
      # toolchain installs them during configure. An explicit
      # `vcpkg install <pkg>` is rejected in manifest mode.
      - name: Configure
        run: cmake --preset ci

      - name: Build Release
        run: cmake --build --preset ci-release

      - name: Run tests
        run: ctest --preset ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ds1edit-windows
          path: |
            bin/ds1edit.exe
            data/
            pcx/
            assets/*.ini
            Ds1edit.ini.sample
          retention-days: 30
