name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Ninja + the MSVC env rather than a Visual Studio generator: hosted
      # runners rotate VS versions, and a pinned generator breaks on each bump.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      # Runners expose vcpkg as VCPKG_INSTALLATION_ROOT; the ci preset reads
      # VCPKG_ROOT. Dependencies come from vcpkg.json in manifest mode, so the
      # toolchain installs them during configure.
      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset ci
      - name: Build
        run: cmake --build --preset ci-release
      - name: Test
        run: ctest --preset ci

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build cmake pkg-config zlib1g-dev \
            liballegro5-dev liballegro-image5-dev liballegro-ttf5-dev \
            liballegro-dialog5-dev liballegro-acodec5-dev
      - name: Configure
        run: cmake --preset linux
      - name: Build
        run: cmake --build --preset linux

      # Temporary: 'ds1edit help' dies with SIGABRT here but not on Windows.
      # Run it directly so glibc's diagnostic reaches the log.
      - name: Diagnose startup
        run: |
          echo "--- ds1edit help ---"
          ./bin/ds1edit help; echo "exit=$?"
          echo "--- under gdb ---"
          sudo apt-get install -y -qq gdb >/dev/null
          gdb -batch -ex run -ex bt --args ./bin/ds1edit help 2>&1 | tail -40

      - name: Test
        run: ctest --preset linux --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: brew install allegro ninja pkg-config
      - name: Configure
        run: cmake --preset macos
      - name: Build
        run: cmake --build --preset macos

      # Temporary: 'ds1edit help' dies with SIGABRT on macOS but not Linux.
      - name: Diagnose startup
        run: |
          echo "--- ds1edit help ---"
          ./bin/ds1edit help 2>&1 | tail -20; echo "exit=${PIPESTATUS[0]}"
          echo "--- crash report ---"
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          cat ~/Library/Logs/DiagnosticReports/ds1edit* 2>/dev/null | head -60 || true
        continue-on-error: true

      - name: Test
        run: ctest --preset macos --output-on-failure
