name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Dependencies come from vcpkg.json (manifest mode); the CMake toolchain
      # installs them during configure. An explicit `vcpkg install <pkg>` is
      # rejected in manifest mode.
      # GitHub runners expose vcpkg as VCPKG_INSTALLATION_ROOT; the ci preset
      # reads VCPKG_ROOT, so bridge the two before configuring.
      - name: Point VCPKG_ROOT at the runner's vcpkg
        shell: pwsh
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset ci

      - name: Build Release
        run: cmake --build --preset ci-release

      - name: Run tests
        run: ctest --preset ci

      # Use the generator's PACKAGE target rather than bare `cpack` -- the
      # runner has Chocolatey on PATH, whose own cpack.exe shadows CMake's.
      - name: Package
        run: cmake --build build --config Release --target PACKAGE

      - name: Rename artifact
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          New-Item -ItemType Directory -Force dist | Out-Null
          $zip = Get-ChildItem build -Filter 'DS1Edit-*.zip' | Select-Object -First 1
          if (-not $zip) { throw "CPack produced no ZIP in build/" }
          Move-Item $zip.FullName "dist/ds1edit-$tag-win32.zip"
          Get-ChildItem dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*.zip
          draft: true
          generate_release_notes: false
