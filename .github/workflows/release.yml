name: Release

# Releases publish the packages a qualified candidate build already produced.
# Nothing is rebuilt here: a rebuilt package has new bytes, and new bytes are
# not the package the qualification evidence describes.
#
# 1. Compute the canonical source-state digest of the tagged checkout.
# 2. Load the maintainer-reviewed record release/qualification/<digest>.json.
#    (A metadata-only follow-up commit may carry it; the digest excludes
#    release/qualification/, and the source identity is checked separately.)
# 3. Check that the record's candidate run is a successful build.yml run of
#    this repository, built from the recorded commit.
# 4. Download that run's candidate artifacts and verify the per-platform
#    manifests, every package hash, the evidence files (each must be part of
#    the reviewed record), every individual required result and the
#    profile/contract/baseline identities (scripts/equivalence/qualify.py).
#    Waivers in the record excuse only results that never ran, only for this
#    version; they are listed in the draft release notes ("Waived checks").
# 5. Only then attach those exact files to a draft release.
#
# Steps 1-4 are scripts/equivalence/release_record.py (find-record, check-run,
# verify-release): `python -m scripts.equivalence.release_record ... --dry-run-release`
# runs them locally against the same run and tag before anything is pushed.
#
# If the candidate run's artifacts have expired, this fails: produce a new
# candidate, requalify it, and review a new record. Reports from any other
# location are never accepted, and this workflow tags, dispatches and
# approves nothing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write
  actions: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  PLATFORMS: windows-x86 linux-x86_64 macos-arm64

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find the reviewed qualification record for this source state
        id: record
        run: |
          set -euo pipefail
          python -m scripts.equivalence.release_record find-record >> "$GITHUB_OUTPUT"

      - name: Check the recorded candidate run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.record.outputs.run_id }}
          RECORD: ${{ steps.record.outputs.record }}
        run: |
          set -euo pipefail
          case "$RUN_ID" in (*[!0-9]*|'') echo "::error::candidate_run_id '$RUN_ID' is not a GitHub run ID"; exit 1;; esac
          gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" > run.json
          python -m scripts.equivalence.release_record check-run \
            --record "$RECORD" --run-json run.json --repository "${{ github.repository }}"
          rm -f run.json

      - name: Download the candidate packages (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.record.outputs.run_id }}
        run: |
          set -euo pipefail
          for p in $PLATFORMS; do
            if ! gh run download "$RUN_ID" -R "${{ github.repository }}" -n "candidate-$p" -D "candidate/$p"; then
              echo "::error::candidate-$p from run $RUN_ID is unavailable (expired?). Build a new candidate and requalify it."
              exit 1
            fi
          done
          find candidate -type f -exec ls -l {} +

      - name: Verify identities, hashes, evidence and every required result
        env:
          RECORD: ${{ steps.record.outputs.record }}
        run: |
          set -euo pipefail
          python -m scripts.equivalence.release_record verify-release \
            --record "$RECORD" --candidate-dir candidate --tag "$TAG" \
            --notes-out release-notes/RELEASE_NOTES.md
          echo '### Release notes (draft)' >> "$GITHUB_STEP_SUMMARY"
          cat release-notes/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Stage the verified packages
        run: |
          set -euo pipefail
          mkdir -p dist
          for p in $PLATFORMS; do
            for f in candidate/$p/DS1Edit-*; do
              case "$f" in
                *.zip)    cp "$f" "dist/ds1edit-${TAG}-${p}.zip" ;;
                *.tar.gz) cp "$f" "dist/ds1edit-${TAG}-${p}.tar.gz" ;;
                *) echo "::error::unexpected package $f"; exit 1 ;;
              esac
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

      # The draft notes carry the qualification identity and the "Waived
      # checks" section; they are the release body, not a release asset.
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes/RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - run: ls -la dist notes && (cd dist && sha256sum -c SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          body_path: notes/RELEASE_NOTES.md
          draft: true
          generate_release_notes: false
