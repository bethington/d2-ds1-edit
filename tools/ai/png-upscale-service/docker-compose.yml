services:
  png-upscale-service:
    build:
      context: .
    container_name: png-upscale-service
    restart: unless-stopped
    ports:
      - "${PNG_UPSCALE_PORT:-8084}:8080"
    environment:
      REALESRGAN_MODEL: ${REALESRGAN_MODEL:-RealESRGAN_x4plus}
      REALESRGAN_TILE: ${REALESRGAN_TILE:-0}
      REALESRGAN_HALF: ${REALESRGAN_HALF:-1}
      MODEL_CACHE_DIR: /models
    volumes:
      - ./models:/models
    gpus: all